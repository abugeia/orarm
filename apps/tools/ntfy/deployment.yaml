# ntfy : canal de notification des alertes du homelab (Grafana, Gatus).
# Hébergé ici, hors de la maison, pour rester joignable quand pve1, la box
# ou le k3s home_kluster tombent.
#
# Toute la configuration, comptes et jetons compris, est dans server.yml,
# fourni par le SealedSecret `ntfy-config` (secrets/sealed/ntfy-config.yaml).
# Accès refusé par défaut : seul `antoine` (admin) lit, `publisher` écrit
# sur homelab-* avec ses jetons.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: ntfy-data
  namespace: observability
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: local-path
  resources:
    requests:
      storage: 1Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ntfy
  namespace: observability
  labels:
    app: ntfy
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: ntfy
  template:
    metadata:
      labels:
        app: ntfy
    spec:
      # Les workers oramd-* sont hors service : on reste sur le control-plane,
      # où vit aussi le volume local-path.
      nodeSelector:
        kubernetes.io/hostname: orarm
      securityContext:
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        runAsNonRoot: true
      containers:
        - name: ntfy
          image: binwiederhier/ntfy:v2.38.1
          args: ["serve", "--config", "/etc/ntfy/server.yml"]
          ports:
            - name: http
              containerPort: 8080
          readinessProbe:
            httpGet:
              path: /v1/health
              port: http
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /v1/health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 30
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              memory: 128Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: config
              mountPath: /etc/ntfy
              readOnly: true
            - name: data
              mountPath: /var/lib/ntfy
      volumes:
        - name: config
          secret:
            secretName: ntfy-config
        - name: data
          persistentVolumeClaim:
            claimName: ntfy-data
---
apiVersion: v1
kind: Service
metadata:
  name: ntfy
  namespace: observability
spec:
  selector:
    app: ntfy
  ports:
    - name: http
      port: 80
      targetPort: http
---
# Pas d'oauth2-proxy : l'app mobile doit joindre ntfy directement, ntfy
# authentifie lui-même (deny-all par défaut).
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: ntfy
  namespace: observability
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt
spec:
  ingressClassName: traefik
  tls:
    - hosts:
        - ntfy.cagou.ovh
      secretName: ntfy-tls
  rules:
    - host: ntfy.cagou.ovh
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: ntfy
                port:
                  number: 80
